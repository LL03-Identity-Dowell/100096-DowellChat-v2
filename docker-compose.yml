version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    container_name: dowell_postgres
    volumes:
      - dowell_postgres_data:/var/lib/postgresql/data
      - dowell_postgres_data_backups:/backups
    env_file:
      - .env
    environment:
      # - "POSTGRES_HOST_AUTH_METHOD=trust"
      - POSTGRES_DB=dowellchat_db1
      - POSTGRES_USER=user_1
      - POSTGRES_PASSWORD=dowellchat@2024
    ports:
      - "5432:5432"
  chat-backend:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    container_name: dowellchat-backend
    restart: always
    depends_on:
      - db
    command: bash -c "./wait-for-it.sh --timeout=0 db:5432  && ./entrypoint.sh"
    # command: >
    #   sh -c "python -c 'import time; from django.db import connections, OperationalError;     db_conn = None;      while not db_conn:
    #     try: db_conn = connections[\"default\"]; db_conn.cursor(); 
    #     except OperationalError: print(\"Database unavailable, waiting 1 second...\"); time.sleep(1)' &&
    #   python manage.py migrate && python -c 'from django.contrib.auth import get_user_model; User = get_user_model(); if not User.objects.filter(username=\"admin\").exists():
    #     User.objects.create_superuser(\"admin\", \"admin@example.com\", \"pass123456\")' &&
    #   gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 Chat.wsgi:application --timeout 9999"

    # command: >
    #   sh -c "python manage.py migrate &&
    #          echo \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.create_superuser('admin', 'admin@example.com', 'pass123456') if not User.objects.filter(username='admin').exists() else None\" | python manage.py shell &&
    #          gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 Chat.wsgi:application --timeout 9999"
    # command: >
    #   sh -c "python manage.py migrate &&
    #          gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 Chat.wsgi:application --timeout 9999"
    # command: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 Chat.wsgi:application --timeout 9999
    # command: [ "postgres:5432", "--", "gunicorn", "-k", "geventwebsocket.gunicorn.workers.GeventWebSocketWorker", "-w", "1", "Chat.wsgi:application", "--timeout", "9999" ]
    ports:
      - "8001:8001"
    expose:
      - 8001
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: pass123456
      DJANGO_SETTINGS_MODULE: Chat.settings

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"

  kafka:
    image: ubuntu/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # topic creation
      KAFKA_CREATE_TOPICS: "ticket_chat_topic_test:3:2,ticket_topic_test:3:2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
  kafka-consumer:
    build:
      context: .
      dockerfile: ./compose/kafka_consumer/Dockerfile
    container_name: kafka-consumer
    restart: always
    command: python3 manage.py launch_consumer
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
    depends_on:
      - db
      - chat-backend
      - kafka
      - zookeeper

volumes:
  dowell_postgres_data: {}
  dowell_postgres_data_backups: {}

