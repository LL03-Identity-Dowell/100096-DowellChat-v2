version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    container_name: dowell_postgres
    volumes:
      - dowell_postgres_data:/var/lib/postgresql/data
      - dowell_postgres_data_backups:/backups
    env_file:
      - .env
    environment:
      POSTGRES_DB: dowellchat_db1
      POSTGRES_USER: user_1
      POSTGRES_PASSWORD: dowellchat@2024
    ports:
      - "5432:5432"
    networks:
      - webnet

  chat-backend:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    container_name: dowellchat-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8001:8001"
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: pass123456
      DJANGO_SETTINGS_MODULE: Chat.settings
      ADMIN_PASSWORD: trial1
      KAFKA_REQUEST_TIMEOUT_MS: 30000 # 30 seconds
      KAFKA_SESSION_TIMEOUT_MS: 15000 # 15 seconds
    networks:
      - webnet

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - webnet

  kafka:
    image: ubuntu/kafka:latest
    # image: bitnami/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      # KAFKA_ADVERTISED_HOST_NAME: kafka
      # KAFKA_BROKER_ID: 1
      # KAFKA_LISTENERS: INTERNAL://kafka:9092
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "ticket_chat_topic_test:3:2,ticket_topic_test:3:2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    networks:
      - webnet

  kafka-consumer:
    build:
      context: .
      dockerfile: ./compose/kafka_consumer/Dockerfile
    container_name: kafka-consumer
    restart: always
    command: python3 manage.py launch_consumer
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
      KAFKA_REQUEST_TIMEOUT_MS: 30000 # 30 seconds
      KAFKA_SESSION_TIMEOUT_MS: 15000 # 15 seconds
    depends_on:
      - db
      - chat-backend
      - kafka
      - zookeeper
    networks:
      - webnet

  nginx:
    build:
      context: .
      dockerfile: ./compose/nginx/Dockerfile
    container_name: nginx_con
    restart: always
    depends_on:
      - chat-backend
    volumes:
      - ./compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/static
      - ./media:/media
      - /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/fullchain.pem:/etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/fullchain.pem:ro
      - /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/privkey.pem:/etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - webnet

volumes:
  dowell_postgres_data: {}
  dowell_postgres_data_backups: {}

networks:
  webnet:
    external: true
