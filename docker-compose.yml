version: "3.8"

services:
  chat-backend:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    container_name: dowellchat-backend
    restart: always
    ports:
      - "8001:8001"
    expose:
      - 8001
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
    depends_on:
      - postgres
    networks:
      - webnet

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - webnet

  kafka:
    image: ubuntu/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # topic creation
      KAFKA_CREATE_TOPICS: "ticket_chat_topic_test:3:2,ticket_topic_test:3:2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    networks:
      - webnet

  kafka-consumer:
    build:
      context: .
    container_name: kafka-consumer
    restart: always
    command: python3 manage.py launch_consumer
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
    depends_on:
      - chat-backend
      - kafka
      - zookeeper
    networks:
      - webnet

  postgres:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    container_name: dowell_postgres
    volumes:
      - dowell_postgres_data:/var/lib/postgresql/data
      - dowell_postgres_data_backups:/backups
    env_file:
      - .env
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    networks:
      - webnet

volumes:
  dowell_postgres_data: {}
  dowell_postgres_data_backups: {}

networks:
  webnet:
    name: webnet
