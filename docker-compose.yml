version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    container_name: dowell_postgres
    volumes:
      - dowell_postgres_data:/var/lib/postgresql/data
      - dowell_postgres_data_backups:/backups
    env_file:
      - .env
    environment:
      # - "POSTGRES_HOST_AUTH_METHOD=trust"
      - POSTGRES_DB=dowellchat_db1
      - POSTGRES_USER=user_1
      - POSTGRES_PASSWORD=dowellchat@2024
    ports:
      - "5432:5432"
  chat-backend:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    container_name: dowellchat-backend
    restart: always
    depends_on:
      - db
    command: bash -c "./wait-for-it.sh --timeout=900 db:5432  && ./entrypoint.sh"
    ports:
      - "8001:8001"
    expose:
      - 8001
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: pass123456
      DJANGO_SETTINGS_MODULE: Chat.settings
      ADMIN_PASSWORD: trial1#2024

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"

  kafka:
    image: ubuntu/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # topic creation
      KAFKA_CREATE_TOPICS: "ticket_chat_topic_test:3:2,ticket_topic_test:3:2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
  kafka-consumer:
    build:
      context: .
      dockerfile: ./compose/kafka_consumer/Dockerfile
    container_name: kafka-consumer
    restart: always
    command: python3 manage.py launch_consumer
    volumes:
      - .:/usr/src/app
    environment:
      API_KEY: 1b834e07-c68b-4bf6-96dd-ab7cdc62f07f
      ENVIRON: kafka
    depends_on:
      - db
      - chat-backend
      - kafka
      - zookeeper

volumes:
  dowell_postgres_data: {}
  dowell_postgres_data_backups: {}

nginx:
  build: ./nginx
  image: nginx:latest
  container_name: "nginx_con"
  depends_on:
    - django
  volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    - ./static:/static
    - ./media:/media
    # - /home/dowell/100096-DowellChat-v2/nginx/certificate.crt:/home/dowell/100096-DowellChat-v2/nginx/certificate.crt:ro
    # - /home/dowell/100096-DowellChat-v2/nginx/private.key:/home/dowell/100096-DowellChat-v2/nginx/private.key:ro
    - /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/fullchain.pem:/etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/fullchain.pem:ro
    - /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/privkey.pem:/etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/privkey.pem:ro

  ports:
    - "80:80"
    - 443:443
  networks:
    - webnet


# networks:
#   webnet:
# networks:
#   default:
#     external:
#       name: webnet
networks:
  default:
    name: webnet
    external: true
