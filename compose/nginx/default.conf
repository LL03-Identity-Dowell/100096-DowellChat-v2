server {
    listen 80;
    server_name 216.158.239.24 www.dowellchat.uxlivinglab.online;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server configuration
server {
    listen 443 ssl;
    server_name 216.158.239.24 www.dowellchat.uxlivinglab.online;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dowellchat.uxlivinglab.online/privkey.pem;

    location / {
        proxy_pass http://chat-frontend:5173;  # Ensure 'chat-frontend' resolves correctly
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://chat-backend:8001;  # Ensure 'chat-backend' resolves correctly
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io {
        proxy_pass http://chat-backend:8001;  # Ensure 'chat-backend' resolves correctly
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /static/ {
        alias /static/;  # Ensure this path matches your setup
    }

    location /media/ {
        alias /media/;  # Ensure this path matches your setup
    }
}
